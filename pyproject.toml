[project]
name = "hypnet"
version = "0.1.0"
description = "仮説と知見のネットワーク: 交換フォーマットと、知見の導出・伝搬・来歴・承認台帳"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2", "networkx>=3.2"]

[project.optional-dependencies]
sign = ["cryptography>=41"]
dev = ["pytest"]

[project.scripts]
hn = "hypnet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hypnet"]
